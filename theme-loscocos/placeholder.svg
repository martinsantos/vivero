<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="placeholderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f3f4f6" />
            <stop offset="100%" stop-color="#e5e7eb" />
        </linearGradient>
        <filter id="placeholderShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="rgba(0,0,0,0.2)"/>
        </filter>
    </defs>
    
    <!-- Fondo -->
    <rect width="100%" height="100%" fill="url(#placeholderGrad)" rx="20" ry="20"/>
    
    <!-- Patrón decorativo sutil -->
    <circle cx="100" cy="100" r="30" fill="rgba(255,255,255,0.3)"/>
    <circle cx="300" cy="130" r="20" fill="rgba(255,255,255,0.3)"/>
    <circle cx="280" cy="280" r="25" fill="rgba(255,255,255,0.3)"/>
    <circle cx="120" cy="320" r="15" fill="rgba(255,255,255,0.3)"/>
    
    <!-- Icono de imagen -->
    <rect x="150" y="150" width="100" height="80" rx="8" fill="#9ca3af" filter="url(#placeholderShadow)"/>
    <circle cx="175" cy="175" r="8" fill="#f3f4f6"/>
    <polygon points="150,210 170,190 185,205 230,160 250,180 250,230 150,230" fill="#f3f4f6"/>
    
    <!-- Texto -->
    <text x="50%" y="70%" dominant-baseline="middle" text-anchor="middle" 
          font-family="system-ui, sans-serif" font-size="16" 
          fill="#6b7280" font-weight="500">Sin imagen</text>
    
    <!-- Indicador "Los Cocos" -->
    <text x="50%" y="85%" dominant-baseline="middle" text-anchor="middle" 
          font-family="system-ui, sans-serif" font-size="12" 
          fill="#9ca3af" font-weight="400">Los Cocos</text>
</svg>