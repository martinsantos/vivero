<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Final JavaScript - Los Cocos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        .log-entry {
            padding: 0.5rem 1rem;
            margin: 0.25rem 0;
            border-radius: 0.375rem;
            font-family: monospace;
            font-size: 0.875rem;
        }
        .log-success { background: #d1fae5; color: #065f46; }
        .log-error { background: #fee2e2; color: #991b1b; }
        .log-warning { background: #fef3c7; color: #92400e; }
        .log-info { background: #dbeafe; color: #1e40af; }
    </style>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">🧪 Test Final de JavaScript - Los Cocos</h1>
        
        <!-- Status del sistema -->
        <div class="grid md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow-md p-6">
                <h3 class="text-lg font-semibold mb-4">🛒 Sistema de Carrito</h3>
                <div id="cart-status" class="space-y-2">
                    <div class="text-gray-500">Verificando...</div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow-md p-6">
                <h3 class="text-lg font-semibold mb-4">🔧 JavaScript</h3>
                <div id="js-status" class="space-y-2">
                    <div class="text-gray-500">Verificando...</div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow-md p-6">
                <h3 class="text-lg font-semibold mb-4">🖼️ Imágenes</h3>
                <div id="images-status" class="space-y-2">
                    <div class="text-gray-500">Verificando...</div>
                </div>
            </div>
        </div>
        
        <!-- Productos de prueba -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4">📦 Productos de Prueba</h2>
            <div class="grid md:grid-cols-4 gap-4" id="test-products">
                <!-- Se llenarán dinámicamente -->
            </div>
        </div>
        
        <!-- Console logs -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-semibold mb-4">📋 Console Logs</h2>
            <div class="bg-gray-900 text-green-400 p-4 rounded-lg h-64 overflow-y-auto font-mono text-sm" id="console-logs">
                <div class="text-gray-500">Logs aparecerán aquí...</div>
            </div>
            <div class="mt-4 flex gap-4">
                <button onclick="runAllTests()" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700">
                    🚀 Ejecutar Todos los Tests
                </button>
                <button onclick="clearLogs()" class="bg-gray-600 text-white px-6 py-3 rounded-lg hover:bg-gray-700">
                    🧹 Limpiar Logs
                </button>
                <button onclick="testCartSystem()" class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700">
                    🛒 Test Carrito
                </button>
            </div>
        </div>
    </div>

    <script>
        // Sistema de logging personalizado
        const originalConsole = {
            log: console.log,
            error: console.error,
            warn: console.warn,
            info: console.info
        };
        
        function addLog(message, type = 'info') {
            const logsContainer = document.getElementById('console-logs');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsContainer.appendChild(logEntry);
            logsContainer.scrollTop = logsContainer.scrollHeight;
        }
        
        // Interceptar console logs
        console.log = function(...args) {
            originalConsole.log.apply(console, args);
            addLog(args.join(' '), 'info');
        };
        
        console.error = function(...args) {
            originalConsole.error.apply(console, args);
            addLog(args.join(' '), 'error');
        };
        
        console.warn = function(...args) {
            originalConsole.warn.apply(console, args);
            addLog(args.join(' '), 'warning');
        };
        
        // Test del sistema de carrito
        function testCartSystem() {
            addLog('🧪 Iniciando test del sistema de carrito...', 'info');
            
            // Test 1: Verificar que jQuery está disponible
            if (typeof jQuery !== 'undefined') {
                addLog('✅ jQuery está disponible', 'success');
                updateStatus('js-status', '✅ jQuery OK', 'success');
            } else {
                addLog('❌ jQuery no está disponible', 'error');
                updateStatus('js-status', '❌ jQuery faltante', 'error');
            }
            
            // Test 2: Verificar sistema de carrito Los Cocos
            if (typeof window.LoscocosCart !== 'undefined') {
                addLog('✅ Sistema de carrito Los Cocos disponible', 'success');
                updateStatus('cart-status', '✅ Sistema cargado', 'success');
            } else {
                addLog('⚠️ Sistema de carrito Los Cocos no encontrado', 'warning');
                updateStatus('cart-status', '⚠️ Sistema no encontrado', 'warning');
            }
            
            // Test 3: Verificar función addToCart global
            if (typeof window.addToCart === 'function') {
                addLog('✅ Función addToCart global disponible', 'success');
            } else {
                addLog('❌ Función addToCart global no disponible', 'error');
            }
            
            // Test 4: Buscar botones de carrito
            const buttons = document.querySelectorAll('.add-to-cart, .add-to-cart-btn, [data-product-id]');
            addLog(`🔍 Encontrados ${buttons.length} botones de carrito`, 'info');
            
            if (buttons.length > 0) {
                updateStatus('cart-status', `✅ ${buttons.length} botones`, 'success');
            } else {
                updateStatus('cart-status', '❌ Sin botones', 'error');
            }
        }
        
        // Test de imágenes
        function testImages() {
            addLog('🖼️ Iniciando test de imágenes...', 'info');
            
            const testImageIds = [72, 361, 439, 477, 491, 525];
            let loadedImages = 0;
            let failedImages = 0;
            
            testImageIds.forEach(id => {
                const img = new Image();
                img.onload = function() {
                    loadedImages++;
                    addLog(`✅ Imagen ${id} cargada correctamente`, 'success');
                    updateImageStatus();
                };
                img.onerror = function() {
                    failedImages++;
                    addLog(`❌ Error al cargar imagen ${id}`, 'error');
                    updateImageStatus();
                };
                img.src = `http://localhost:8080/wp-content/uploads/loscocos-images/${id}.svg`;
            });
            
            function updateImageStatus() {
                const total = loadedImages + failedImages;
                if (total === testImageIds.length) {
                    if (failedImages === 0) {
                        updateStatus('images-status', '✅ Todas las imágenes OK', 'success');
                    } else {
                        updateStatus('images-status', `⚠️ ${failedImages} imágenes fallaron`, 'warning');
                    }
                }
            }
        }
        
        // Crear productos de prueba
        function createTestProducts() {
            const products = [
                { id: 525, name: 'Ficus Benjamina', price: 15000 },
                { id: 72, name: 'Maceta Decorativa', price: 8500 },
                { id: 439, name: 'Fertilizante Orgánico', price: 3200 },
                { id: 361, name: 'Kit de Herramientas', price: 12000 }
            ];
            
            const container = document.getElementById('test-products');
            container.innerHTML = '';
            
            products.forEach(product => {
                const productDiv = document.createElement('div');
                productDiv.className = 'bg-gray-50 rounded-lg p-4 text-center';
                productDiv.innerHTML = `
                    <img src="http://localhost:8080/wp-content/uploads/loscocos-images/${product.id}.svg" 
                         alt="${product.name}" 
                         class="w-16 h-16 mx-auto mb-2 rounded"
                         onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjQiIGhlaWdodD0iNjQiIHZpZXdCb3g9IjAgMCA2NCA2NCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiBmaWxsPSIjRjNGNEY2Ii8+CjxwYXRoIGQ9Ik0zMiAyMEMzNi40MTgzIDIwIDQwIDIzLjU4MTcgNDAgMjhDNDAgMzIuNDE4MyAzNi40MTgzIDM2IDMyIDM2QzI3LjU4MTcgMzYgMjQgMzIuNDE4MyAyNCAyOEMyNCAyMy41ODE3IDI3LjU4MTcgMjAgMzIgMjBaIiBmaWxsPSIjOUNBM0FGIi8+Cjx0ZXh0IHg9IjMyIiB5PSIzMiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgZm9udC1zaXplPSIyNCIgZmlsbD0id2hpdGUiPvCfk6Y8L3RleHQ+Cjwvc3ZnPgo='">
                    <h4 class="font-semibold text-sm mb-1">${product.name}</h4>
                    <p class="text-green-600 font-bold mb-2">$${product.price.toLocaleString()}</p>
                    <button class="add-to-cart-btn bg-green-600 text-white px-3 py-1 rounded text-sm hover:bg-green-700"
                            onclick="testAddToCart(${product.id})"
                            data-product-id="${product.id}">
                        Añadir
                    </button>
                `;
                container.appendChild(productDiv);
            });
        }
        
        // Test de añadir al carrito
        function testAddToCart(productId) {
            addLog(`🛒 Probando añadir producto ${productId} al carrito...`, 'info');
            
            if (typeof window.addToCart === 'function') {
                try {
                    window.addToCart(productId, 1);
                    addLog(`✅ Función addToCart ejecutada para producto ${productId}`, 'success');
                } catch (error) {
                    addLog(`❌ Error al ejecutar addToCart: ${error.message}`, 'error');
                }
            } else {
                addLog('❌ Función addToCart no disponible', 'error');
            }
        }
        
        // Actualizar status
        function updateStatus(containerId, message, type) {
            const container = document.getElementById(containerId);
            container.innerHTML = `<div class="text-${type === 'success' ? 'green' : type === 'error' ? 'red' : 'yellow'}-600">${message}</div>`;
        }
        
        // Ejecutar todos los tests
        function runAllTests() {
            addLog('🚀 Iniciando batería completa de tests...', 'info');
            
            setTimeout(() => testCartSystem(), 100);
            setTimeout(() => testImages(), 500);
            setTimeout(() => createTestProducts(), 1000);
            setTimeout(() => {
                addLog('✅ Todos los tests completados', 'success');
            }, 2000);
        }
        
        // Limpiar logs
        function clearLogs() {
            document.getElementById('console-logs').innerHTML = '<div class="text-gray-500">Logs aparecerán aquí...</div>';
        }
        
        // Inicializar al cargar la página
        document.addEventListener('DOMContentLoaded', function() {
            addLog('🌱 Test Final JavaScript - Los Cocos inicializado', 'info');
            createTestProducts();
            
            // Ejecutar tests automáticamente después de 1 segundo
            setTimeout(runAllTests, 1000);
        });
    </script>
</body>
</html>
