<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vivero Los Cocos - Checkout</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#1dc91d",
            "background-light": "#f6f8f6",
            "background-dark": "#112111",
          },
          fontFamily: {
            "display": ["Epilogue"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .form-radio:checked {
      background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='%23112111' xmlns='http://www.w3.org/2000/svg'%3e%3ccircle cx='8' cy='8' r='3'/%3e%3c/svg%3e");
    }
    .dark .form-radio:checked {
       background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='%23f6f8f6' xmlns='http://www.w3.org/2000/svg'%3e%3ccircle cx='8' cy='8' r='3'/%3e%3c/svg%3e");
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-background-dark dark:text-background-light">
<div class="flex flex-col min-h-screen">
<header class="border-b border-background-dark/10 dark:border-background-light/10">
<div class="container mx-auto px-4 sm:px-6 lg:px-8">
<div class="flex items-center justify-between h-16">
<div class="flex items-center gap-4">
<svg class="h-8 w-8 text-primary" fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M24 4H42V17.3333V30.6667H24V44H6V30.6667V17.3333H24V4Z" fill="currentColor" fill-rule="evenodd"></path>
</svg>
<h1 class="text-xl font-bold">Vivero Los Cocos</h1>
</div>
<div class="hidden md:flex items-center gap-8">
<a class="text-sm font-medium hover:text-primary transition-colors" href="#">Shop</a>
<a class="text-sm font-medium hover:text-primary transition-colors" href="#">About</a>
<a class="text-sm font-medium hover:text-primary transition-colors" href="#">Contact</a>
</div>
<div class="flex items-center gap-2">
<button class="p-2 rounded-full hover:bg-background-dark/5 dark:hover:bg-background-light/10 transition-colors">
<span class="material-symbols-outlined">search</span>
</button>
<button class="p-2 rounded-full hover:bg-background-dark/5 dark:hover:bg-background-light/10 transition-colors">
<span class="material-symbols-outlined">shopping_bag</span>
</button>
</div>
</div>
</div>
</header>
<main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12">
<div class="max-w-xl mx-auto">
<div class="mb-8">
<div class="flex items-center text-sm mb-4">
<a class="text-primary hover:underline" href="#">Cart</a>
<span class="mx-2 text-background-dark/50 dark:text-background-light/50">/</span>
<span class="font-medium">Checkout</span>
</div>
<div class="w-full bg-background-dark/10 dark:bg-background-light/10 rounded-full h-2.5">
<div class="bg-primary h-2.5 rounded-full" style="width: 33%"></div>
</div>
<div class="mt-2 grid grid-cols-3 text-xs font-medium text-background-dark/70 dark:text-background-light/70">
<div class="text-primary">Shipping</div>
<div class="text-center">Payment</div>
<div class="text-right">Review</div>
</div>
</div>
<div class="space-y-6">
<div>
<h2 class="text-2xl font-bold mb-6">Shipping Information</h2>
<div class="grid grid-cols-1 gap-4">
<input class="w-full p-3 bg-background-light dark:bg-background-dark border border-background-dark/20 dark:border-background-light/20 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent placeholder-background-dark/50 dark:placeholder-background-light/50" placeholder="Full Name" type="text"/>
<input class="w-full p-3 bg-background-light dark:bg-background-dark border border-background-dark/20 dark:border-background-light/20 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent placeholder-background-dark/50 dark:placeholder-background-light/50" placeholder="Address" type="text"/>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<input class="w-full p-3 bg-background-light dark:bg-background-dark border border-background-dark/20 dark:border-background-light/20 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent placeholder-background-dark/50 dark:placeholder-background-light/50" placeholder="City" type="text"/>
<input class="w-full p-3 bg-background-light dark:bg-background-dark border border-background-dark/20 dark:border-background-light/20 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent placeholder-background-dark/50 dark:placeholder-background-light/50" placeholder="State / Province" type="text"/>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<input class="w-full p-3 bg-background-light dark:bg-background-dark border border-background-dark/20 dark:border-background-light/20 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent placeholder-background-dark/50 dark:placeholder-background-light/50" placeholder="Zip / Postal Code" type="text"/>
<input class="w-full p-3 bg-background-light dark:bg-background-dark border border-background-dark/20 dark:border-background-light/20 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent placeholder-background-dark/50 dark:placeholder-background-light/50" placeholder="Phone Number" type="tel"/>
</div>
</div>
</div>
<div>
<h3 class="text-lg font-bold mb-4">Delivery Options</h3>
<div class="space-y-3">
<label class="flex items-center p-4 border border-background-dark/20 dark:border-background-light/20 rounded-lg cursor-pointer has-[:checked]:border-primary has-[:checked]:ring-2 has-[:checked]:ring-primary">
<input checked="" class="form-radio h-5 w-5 border-background-dark/30 dark:border-background-light/30 text-transparent focus:ring-offset-0 focus:ring-2 focus:ring-primary" name="delivery_option" type="radio"/>
<span class="ml-4 text-sm font-medium">Standard (3-5 business days)</span>
</label>
<label class="flex items-center p-4 border border-background-dark/20 dark:border-background-light/20 rounded-lg cursor-pointer has-[:checked]:border-primary has-[:checked]:ring-2 has-[:checked]:ring-primary">
<input class="form-radio h-5 w-5 border-background-dark/30 dark:border-background-light/30 text-transparent focus:ring-offset-0 focus:ring-2 focus:ring-primary" name="delivery_option" type="radio"/>
<span class="ml-4 text-sm font-medium">Express (1-2 business days)</span>
</label>
</div>
</div>
<div class="pt-4">
<button class="w-full bg-primary text-white font-bold py-3 px-4 rounded-lg hover:bg-primary/90 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary/50 focus:ring-offset-background-light dark:focus:ring-offset-background-dark">
              Continue to Payment
            </button>
</div>
</div>
</div>
</main>
<footer class="mt-auto">
<div class="container mx-auto px-4 sm:px-6 lg:px-8 py-4">
<p class="text-center text-sm text-background-dark/50 dark:text-background-light/50">© 2023 Vivero Los Cocos. All rights reserved.</p>
</div>
</footer>
</div>

</body></html>
