services:
  # Base de datos MySQL
  db:
    image: mysql:8.0
    container_name: loscocos_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: loscocos_wp
      MYSQL_USER: loscocos_user
      MYSQL_PASSWORD: loscocos_2024
      MYSQL_ROOT_PASSWORD: root_password_2024
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - loscocos_network

  # WordPress con WP-CLI
  wordpress:
    image: wordpress:latest
    container_name: loscocos_wordpress
    restart: unless-stopped
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: loscocos_wp
      WORDPRESS_DB_USER: loscocos_user
      WORDPRESS_DB_PASSWORD: loscocos_2024
      WORDPRESS_DEBUG: 0
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-config.php:/var/www/html/wp-config.php
      - ./wp-content:/var/www/html/wp-content
      - ./docker-init-production.sh:/usr/local/bin/docker-init.sh
    ports:
      - "8080:80"
    networks:
      - loscocos_network

  # Nginx for better file handling
  nginx:
    image: nginx:alpine
    container_name: loscocos_nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-site.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-mime.conf:/etc/nginx/conf.d/mime.conf:ro
      - wordpress_data:/var/www/html:ro
    ports:
      - "8082:80"
    depends_on:
      - wordpress
    networks:
      - loscocos_network

  # WP-CLI para configuración automática
  wpcli:
    image: wordpress:cli
    container_name: loscocos_wpcli
    depends_on:
      - db
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: loscocos_wp
      WORDPRESS_DB_USER: loscocos_user
      WORDPRESS_DB_PASSWORD: loscocos_2024
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-config.php:/var/www/html/wp-config.php
      - ./wp-content:/var/www/html/wp-content
      - ./docker-init-production.sh:/usr/local/bin/docker-init.sh
    command: sh -c "sleep 30 && /usr/local/bin/docker-init.sh"
    networks:
      - loscocos_network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: loscocos_phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_password_2024
    ports:
      - "8081:80"
    networks:
      - loscocos_network

volumes:
  db_data:
  wordpress_data:

networks:
  loscocos_network:
    driver: bridge 