services:
  # Base de datos MySQL
  db:
    image: mysql:8.0
    container_name: loscocos_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: loscocos_wp
      MYSQL_USER: loscocos_user
      MYSQL_PASSWORD: loscocos_2024
      MYSQL_ROOT_PASSWORD: root_password_2024
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  # WordPress
  wordpress:
    image: wordpress:latest
    container_name: loscocos_wordpress
    restart: unless-stopped
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: loscocos_wp
      WORDPRESS_DB_USER: loscocos_user
      WORDPRESS_DB_PASSWORD: loscocos_2024
      WORDPRESS_DEBUG: 1
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-config.php:/var/www/html/wp-config.php
      - ./theme-loscocos:/var/www/html/wp-content/themes/loscocos
    ports:
      - "8080:80"

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: loscocos_phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_password_2024
    ports:
      - "8081:80"

volumes:
  db_data:
  wordpress_data:

networks:
  loscocos_network:
    driver: bridge 